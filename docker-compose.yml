version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: complaint_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - complaint_net

  # Express.js Backend Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: complaint_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/complaint_system
      - JWT_SECRET=prod_docker_secret_key_abc123
      - JWT_EXPIRE=7d
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - complaint_net

  # NGINX Frontend Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: complaint_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - complaint_net

networks:
  complaint_net:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
